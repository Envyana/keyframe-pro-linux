[project]
name = "keyframe-pro-linux"
version = "0.1.0"
description = "Cross-platform animation reference player inspired by Keyframe Pro 2"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "python-mpv>=1.0.5",
]

[project.scripts]
keyframe-pro = "keyframe_pro.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
